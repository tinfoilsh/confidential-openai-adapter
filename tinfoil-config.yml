cvm-version: 0.14.15

cpus: 2
memory: 2048

# The shim terminates TLS and forwards plaintext inside the enclave.
shim:
  upstream-port: 8443
  authenticated: true
  paths:
    - /v1/chat/completions
    - /v1/completions
    - /v1/responses
    - /v1/embeddings
    - /v1/models
    - /healthz

networks:
  upstream:
    # Attestation hosts are discovered at startup; allowlists do not support wildcards.
    egress: open

containers:
  - name: adapter
    image: "ghcr.io/tinfoilsh/confidential-openai-adapter@sha256:5160a11d4f58e7a33485b2f7379a50ac9b85b861ddeb5bd76e595ad11b0e5012" # v0.1.4
    networks: [upstream]
    env:
      - TINFOIL_GATEWAY_URL: https://inference-gateway.tinfoil.sh
    read_only: true
    restart: always
