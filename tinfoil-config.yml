cvm-version: 0.11.0

cpus: 2
memory: 2048

# The shim terminates TLS and forwards plaintext inside the enclave.
shim:
  upstream-port: 8443
  authenticated: true
  paths:
    - /v1/chat/completions
    - /v1/completions
    - /v1/responses
    - /v1/embeddings
    - /v1/models
    - /healthz

networks:
  upstream:
    # Attestation hosts are discovered at startup; allowlists do not support wildcards.
    egress: open

containers:
  - name: adapter
    image: "ghcr.io/tinfoilsh/confidential-openai-adapter@sha256:57a1b33101403fe2f703c719d151c04ef64489987c7eb6002cceec096d648aaa" # v0.1.1
    networks: [upstream]
    env:
      - TINFOIL_GATEWAY_URL: https://inference-gateway.tinfoil.sh
    read_only: true
    restart: always
