cvm-version: 0.14.15

cpus: 2
memory: 2048

# The shim terminates TLS and forwards plaintext inside the enclave.
shim:
  upstream-port: 8443
  authenticated: true
  paths:
    - /v1/chat/completions
    - /v1/completions
    - /v1/responses
    - /v1/embeddings
    - /v1/models
    - /healthz

networks:
  upstream:
    # Attestation hosts are discovered at startup; allowlists do not support wildcards.
    egress: open

containers:
  - name: adapter
    image: "ghcr.io/tinfoilsh/confidential-openai-adapter@sha256:8b2a965945efd4b509145608e1f595736861547c311637219e050e475b218e64" # v0.1.3
    networks: [upstream]
    env:
      - TINFOIL_GATEWAY_URL: https://inference-gateway.tinfoil.sh
    read_only: true
    restart: always
